<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LateNight Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 3.5rem;
            letter-spacing: 3px;
            color: #66fcf1;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p.subtitle {
            color: #45a29e;
            font-size: 1.2rem;
            margin-bottom: 35px;
        }
        nav {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: #c5c6c7;
            text-decoration: none;
            background-color: #1f2833;
            border: 1px solid #45a29e;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s ease;
        }
        nav a:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }
    </style>
</head>
<body>
    <h1>LateNight Studio</h1>
    <p class="subtitle">Unreleased games & prototype archive</p>
    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</body>
</html>
