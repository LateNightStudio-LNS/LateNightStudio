<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LateNight Studio | Home</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow-x: hidden;
        }


        /* =========================================
           LOADING SCREEN
        ========================================= */

        .loading-screen {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 99999;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        .loading-icon {
            width: 95px;
            height: 95px;

            object-fit: contain;
            display: block;
        }

        .loading-screen.finished {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page-container {
            width: 100%;
            min-height: 100vh;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            --sidebar-width: 72px;
            --expanded-width: 280px;

            position: fixed;

            top: 0;
            left: 0;

            width: var(--sidebar-width);
            height: 100vh;

            z-index: 1000;

            background: #000;

            border-right:
                1px solid
                rgba(255, 255, 255, 0.18);

            overflow: hidden;

            transition:
                width 0.55s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),
                box-shadow 0.55s ease;
        }


        /* Desktop hover */

        @media (hover: hover) and (pointer: fine) {

            .sidebar:hover {

                width: var(--expanded-width);

                box-shadow:
                    12px 0 35px
                    rgba(0, 0, 0, 0.45);
            }
        }


        /* Mobile / tablet */

        @media (hover: none) {

            .sidebar.expanded {

                width: var(--expanded-width);

                box-shadow:
                    12px 0 35px
                    rgba(0, 0, 0, 0.55);
            }
        }


        /* =========================================
           SIDEBAR TOGGLE
        ========================================= */

        .sidebar-toggle {

            position: absolute;

            top: 16px;
            left: 12px;

            width: 42px;
            height: 42px;

            padding: 0;

            border: none;
            outline: none;

            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 20;

            transition:
                left 0.55s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        @media (hover: hover) and (pointer: fine) {

            .sidebar:hover .sidebar-toggle {

                left:
                    calc(
                        var(--expanded-width) - 58px
                    );
            }
        }


        @media (hover: none) {

            .sidebar.expanded .sidebar-toggle {

                left:
                    calc(
                        var(--expanded-width) - 58px
                    );
            }
        }


        /* =========================================
           SIDEBAR ARROW
        ========================================= */

        .sidebar-arrow {

            width: 27px;
            height: 27px;

            object-fit: contain;

            /*
             * Arrow.png naturally points LEFT.
             *
             * Collapsed = RIGHT
             * Expanded = LEFT
             */

            transform: rotate(180deg);

            transition:
                transform 0.55s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        @media (hover: hover) and (pointer: fine) {

            .sidebar:hover .sidebar-arrow {

                transform: rotate(0deg);
            }
        }


        @media (hover: none) {

            .sidebar.expanded .sidebar-arrow {

                transform: rotate(0deg);
            }
        }


        /* =========================================
           SIDEBAR CONTENT
        ========================================= */

        .sidebar-content {

            position: absolute;

            top: 90px;
            left: 25px;

            width:
                calc(
                    var(--expanded-width) - 50px
                );

            opacity: 0;

            transform: translateX(-18px);

            pointer-events: none;

            transition:
                opacity 0.35s ease 0.08s,
                transform 0.55s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        @media (hover: hover) and (pointer: fine) {

            .sidebar:hover .sidebar-content {

                opacity: 1;

                transform: translateX(0);

                pointer-events: auto;
            }
        }


        @media (hover: none) {

            .sidebar.expanded .sidebar-content {

                opacity: 1;

                transform: translateX(0);

                pointer-events: auto;
            }
        }


        .sidebar-content h2 {

            font-size: 13px;

            font-weight: 400;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 30px;

            color:
                rgba(255, 255, 255, 0.65);
        }


        /* =========================================
           SIDEBAR ITEM
        ========================================= */

        .sidebar-item {

            width: 100%;
            height: 52px;

            display: flex;
            align-items: center;

            gap: 18px;

            padding: 0 12px;

            color: #fff;

            text-decoration: none;

            border-radius: 7px;

            opacity: 0.72;

            transition:
                background 0.2s ease,
                opacity 0.2s ease,
                padding-left 0.25s ease;
        }


        .sidebar-item:hover {

            background:
                rgba(255, 255, 255, 0.06);

            opacity: 1;

            padding-left: 17px;
        }


        /* Larger Home icon */

        .sidebar-icon {

            width: 30px;
            height: 30px;

            object-fit: contain;

            flex-shrink: 0;
        }


        .sidebar-item span {

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            white-space: nowrap;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main-content {

            width: 100%;
            min-height: 100vh;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero-section {

            width: 100%;
            height: 100vh;

            min-height: 600px;

            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            background-image:
                url('night_cityscape.jpg');

            background-size: cover;

            background-position: center;

            overflow: hidden;
        }


        /*
         * Black overlay used to fade the city
         * completely away after the intro.
         */

        .hero-section::after {

            content: "";

            position: absolute;

            inset: 0;

            background: #000;

            opacity: 0;

            pointer-events: none;

            z-index: 1;

            transition:
                opacity 1.5s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        .hero-section.fade-background::after {
            opacity: 1;
        }


        /* =========================================
           HERO CONTENT
        ========================================= */

        .hero-content {

            position: relative;

            width: 100%;
            height: 100%;

            z-index: 2;
        }


        /* =========================================
           TITLE
        ========================================= */

        .central-title {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            color: #fff;

            font-family:
                "CursiveFont",
                cursive;

            font-size:
                clamp(
                    4rem,
                    8vw,
                    8rem
                );

            font-weight: 300;

            line-height: 1;

            white-space: nowrap;

            text-align: center;

            text-shadow:
                0 0 10px
                rgba(255, 255, 255, 0.3);

            z-index: 5;

            transition:

                left 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                top 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                transform 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                font-size 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                text-shadow 1s ease;
        }


        /*
         * Desktop final position.
         */

        .intro-finished .central-title {

            left: 110px;
            top: 34px;

            transform:
                translate(0, 0);

            font-size: 2rem;

            text-shadow:
                0 0 8px
                rgba(255, 255, 255, 0.18);
        }


        /* =========================================
           MOBILE TITLE
        ========================================= */

        .mobile-title {
            display: none;
        }


        /* =========================================
           SEARCH BAR
        ========================================= */

        .hero-search {

            position: absolute;

            top: 27px;
            right: 55px;

            width: 360px;
            height: 44px;

            display: flex;

            align-items: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.25);

            background:
                rgba(0, 0, 0, 0.20);

            backdrop-filter: blur(5px);

            -webkit-backdrop-filter: blur(5px);

            opacity: 0;

            transform:
                translateY(-12px);

            pointer-events: none;

            transition:

                opacity 0.7s ease,

                transform 0.7s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),

                border-color 0.25s ease,

                background 0.25s ease,

                box-shadow 0.25s ease;
        }


        /*
         * Search appears only after the
         * title has finished moving.
         */

        .intro-finished .hero-search {

            opacity: 1;

            transform:
                translateY(0);

            pointer-events: auto;

            transition-delay: 0.15s;
        }


        .hero-search:focus-within {

            border-color:
                rgba(255, 255, 255, 0.48);

            background:
                rgba(0, 0, 0, 0.35);

            box-shadow:
                0 0 18px
                rgba(255, 255, 255, 0.05);
        }


        .hero-search-icon {

            width: 25px;
            height: 25px;

            object-fit: contain;

            flex-shrink: 0;

            margin-left: 14px;

            opacity: 0.55;
        }


        .hero-search-input {

            width: 100%;
            height: 100%;

            padding: 0 15px;

            border: none;
            outline: none;

            background: transparent;

            color: #fff;

            font-family: inherit;

            font-size: 14px;

            letter-spacing: 1px;
        }


        .hero-search-input::placeholder {

            color:
                rgba(255, 255, 255, 0.36);

            opacity: 1;
        }


        /* =========================================
           LOWER SECTIONS
        ========================================= */

        .lower-section {

            width: 100%;

            min-height: 100vh;

            background: #000;

            padding: 80px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .sidebar {

                --sidebar-width: 60px;
                --expanded-width: 245px;
            }


            .hero-section {

                min-height: 100svh;

                height: 100svh;

                background-position:
                    center center;
            }


            .sidebar-arrow {

                width: 25px;
                height: 25px;
            }


            .sidebar-icon {

                width: 29px;
                height: 29px;
            }


            /* Initial large title */

            .central-title {

                font-size:
                    clamp(
                        3rem,
                        12vw,
                        5rem
                    );
            }


            /*
             * Hide "LateNight Studio"
             * once intro finishes.
             */

            .intro-finished .desktop-title {
                display: none;
            }


            /*
             * Show LNS after animation.
             */

            .intro-finished .mobile-title {
                display: block;
            }


            /*
             * Final mobile title position.
             */

            .intro-finished .central-title {

                left: 78px;
                top: 28px;

                transform:
                    translate(0, 0);

                font-size: 2rem;

                letter-spacing: 1px;
            }


            /* Mobile search */

            .hero-search {

                top: 20px;

                right: 15px;

                width:
                    calc(
                        100vw - 145px
                    );

                max-width: 220px;

                height: 40px;
            }


            .hero-search-icon {

                width: 21px;
                height: 21px;

                margin-left: 10px;
            }


            .hero-search-input {

                font-size: 12px;

                padding:
                    0 9px;
            }


            .lower-section {

                padding:
                    40px 25px;
            }


            .loading-icon {

                width: 75px;
                height: 75px;
            }
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 400px) {

            .intro-finished .central-title {

                left: 70px;
                top: 28px;

                font-size: 1.8rem;
            }


            .hero-search {

                right: 10px;

                width:
                    calc(
                        100vw - 130px
                    );

                height: 38px;
            }


            .hero-search-icon {

                width: 19px;
                height: 19px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================= -->

    <div
        id="loadingScreen"
        class="loading-screen"
    >

        <img
            src="LoadingIcon.gif"
            alt="Loading"
            class="loading-icon"
        >

    </div>


    <!-- =========================================
         PAGE
    ========================================= -->

    <div class="page-container">


        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <button
                class="sidebar-toggle"
                id="sidebarToggle"
                aria-label="Open sidebar"
                aria-expanded="false"
            >

                <img
                    class="sidebar-arrow"
                    src="Arrow.png"
                    alt=""
                >

            </button>


            <nav class="sidebar-content">

                <h2>
                    LateNight Studio
                </h2>


                <a
                    href="#home"
                    class="sidebar-item"
                >

                    <img
                        src="HomeIcon.png"
                        alt=""
                        class="sidebar-icon"
                    >

                    <span>
                        Home
                    </span>

                </a>

            </nav>

        </aside>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="main-content">


            <!-- =================================
                 HOME / HERO
            ================================== -->

            <section
                class="hero-section"
                id="home"
            >

                <div class="hero-content">


                    <!-- TITLE -->

                    <h1 class="central-title">

                        <span class="desktop-title">
                            LateNight Studio
                        </span>

                        <span class="mobile-title">
                            LNS
                        </span>

                    </h1>


                    <!-- SEARCH -->

                    <div
                        class="hero-search"
                    >

                        <img
                            src="Search.png"
                            alt=""
                            class="hero-search-icon"
                        >


                        <input
                            type="text"
                            id="heroSearch"
                            class="hero-search-input"
                            placeholder="Search..."
                            maxlength="50"
                            autocomplete="off"
                        >

                    </div>

                </div>

            </section>


            <!-- =================================
                 FUTURE SECTIONS
            ================================== -->

            <section
                class="lower-section"
                id="prototypes"
            ></section>


            <section
                class="lower-section"
                id="projects"
            ></section>


            <section
                class="lower-section"
                id="about"
            ></section>


        </main>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           LOADING SCREEN
        ========================================= */

        const loadingScreen =
            document.getElementById(
                "loadingScreen"
            );


        const heroSection =
            document.querySelector(
                ".hero-section"
            );


        const searchInput =
            document.getElementById(
                "heroSearch"
            );


        /*
         * The loading screen:
         *
         * - stays for AT LEAST 1 second
         * - waits for the page to finish loading
         * - disappears as soon as loading finishes
         * - NEVER stays longer than 10 seconds
         */

        const MIN_LOADING_TIME = 1000;

        const MAX_LOADING_TIME = 10000;


        const loadingStartedAt =
            performance.now();


        let pageFinishedLoading =
            false;


        /* =========================================
           FINISH INITIAL LOADING
        ========================================= */

        function finishInitialLoading() {

            /*
             * Prevent the function from doing
             * anything twice.
             */

            if (pageFinishedLoading) {
                return;
            }


            pageFinishedLoading = true;


            const elapsed =
                performance.now()
                - loadingStartedAt;


            /*
             * If everything loaded too quickly,
             * keep the loading screen visible
             * until at least 1 second has passed.
             */

            const remaining =
                Math.max(
                    0,
                    MIN_LOADING_TIME - elapsed
                );


            setTimeout(
                function() {

                    /*
                     * Fade loading screen out.
                     */

                    loadingScreen.classList.add(
                        "finished"
                    );


                    /*
                     * Wait until that fade is done
                     * before beginning the title animation.
                     */

                    setTimeout(
                        function() {

                            startIntroAnimation();

                        },
                        700
                    );

                },
                remaining
            );
        }


        /* =========================================
           PAGE LOADED
        ========================================= */

        window.addEventListener(
            "load",
            function() {

                finishInitialLoading();

            }
        );


        /* =========================================
           10 SECOND MAXIMUM
        ========================================= */

        /*
         * If something gets stuck loading,
         * don't trap the user on the loading screen
         * forever.
         */

        setTimeout(
            function() {

                if (!pageFinishedLoading) {

                    finishInitialLoading();

                }

            },
            MAX_LOADING_TIME
        );


        /* =========================================
           INTRO ANIMATION
        ========================================= */

        function startIntroAnimation() {

            /*
             * Move the title from the center
             * to the top-left.
             */

            document.body.classList.add(
                "intro-finished"
            );


            /*
             * Fade the city background
             * completely into black.
             */

            heroSection.classList.add(
                "fade-background"
            );


            /*
             * Search becomes active after
             * the title finishes moving.
             */

            setTimeout(
                function() {

                    searchInput.focus();

                },
                1550
            );
        }


        /* =========================================
           FUTURE LOADING FUNCTIONS
        ========================================= */

        /*
         * These can be used later when you add
         * pages, API requests, data, etc.
         */

        function showLoadingScreen() {

            loadingScreen.classList.remove(
                "finished"
            );
        }


        function finishLoading() {

            loadingScreen.classList.add(
                "finished"
            );
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const toggle =
            document.getElementById(
                "sidebarToggle"
            );


        const hoverDevice =
            window.matchMedia(
                "(hover: hover) and (pointer: fine)"
            );


        function updateSidebarState(
            isOpen
        ) {

            sidebar.classList.toggle(
                "expanded",
                isOpen
            );


            toggle.setAttribute(
                "aria-expanded",
                isOpen
            );


            toggle.setAttribute(
                "aria-label",
                isOpen
                    ? "Close sidebar"
                    : "Open sidebar"
            );
        }


        /*
         * On phones/tablets:
         * click arrow to open/close.
         *
         * On desktop:
         * hover controls the sidebar.
         */

        toggle.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                if (!hoverDevice.matches) {

                    const isOpen =
                        sidebar.classList.contains(
                            "expanded"
                        );


                    updateSidebarState(
                        !isOpen
                    );
                }
            }
        );


        /*
         * Reset sidebar state when the device
         * switches between touch/mouse behavior.
         */

        hoverDevice.addEventListener(
            "change",
            function() {

                updateSidebarState(false);

            }
        );


        /* =========================================
           SEARCH
        ========================================= */

        searchInput.addEventListener(
            "input",
            function() {

                if (
                    this.value.length > 50
                ) {

                    this.value =
                        this.value.substring(
                            0,
                            50
                        );
                }
            }
        );

    </script>

</body>

</html>
