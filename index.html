<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LateNight Studio | Home</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow-x: hidden;
        }


        /* =========================================
           LOADING SCREEN
        ========================================= */

        .loading-screen {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 99999;

            background: #000;

            display: flex;

            align-items: center;
            justify-content: center;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }


        .loading-icon {

            width: 95px;
            height: 95px;

            object-fit: contain;

            display: block;
        }


        .loading-screen.finished {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page-container {

            width: 100%;

            min-height: 100vh;
        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            --sidebar-width: 72px;
            --expanded-width: 280px;

            position: fixed;

            top: 0;
            left: 0;

            width: var(--sidebar-width);
            height: 100vh;

            z-index: 1000;

            background: #000;

            border-right:
                1px solid
                rgba(255, 255, 255, 0.18);

            overflow: visible;

            transition:
                width 0.55s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),
                box-shadow 0.55s ease;
        }


        /* =========================================
           EXPANDED SIDEBAR
        ========================================= */

        .sidebar.expanded {

            width: var(--expanded-width);

            box-shadow:
                12px 0 35px
                rgba(0, 0, 0, 0.45);
        }


        /* =========================================
           SIDEBAR TOGGLE
        ========================================= */

        .sidebar-toggle {

            position: absolute;

            top: 16px;
            left: 15px;

            width: 42px;
            height: 42px;

            padding: 0;

            border: none;
            outline: none;

            background: transparent;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 30;

            transition:
                left 0.55s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        /*
         * Move toggle to the right side
         * when sidebar is expanded.
         */

        .sidebar.expanded .sidebar-toggle {

            left:
                calc(
                    var(--expanded-width) - 58px
                );
        }


        /* =========================================
           TOGGLE ICONS
        ========================================= */

        .toggle-icon {

            position: absolute;

            width: 27px;
            height: 27px;

            object-fit: contain;

            transition:

                opacity 0.3s ease,

                transform 0.55s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        /* Main logo */

        .main-icon {

            opacity: 1;

            transform:
                scale(1)
                rotate(0deg);
        }


        /* Arrow */

        .arrow-icon {

            opacity: 0;

            transform:
                scale(0.65)
                rotate(-90deg);
        }


        /*
         * Expanded:
         *
         * MainIcon fades away.
         * Arrow smoothly appears.
         */

        .sidebar.expanded .main-icon {

            opacity: 0;

            transform:
                scale(0.65)
                rotate(90deg);
        }


        .sidebar.expanded .arrow-icon {

            opacity: 1;

            transform:
                scale(1)
                rotate(0deg);
        }


        /* =========================================
           SIDEBAR CONTENT
        ========================================= */

        .sidebar-content {

            position: absolute;

            top: 90px;
            left: 0;

            width: 100%;

            padding:
                0 12px;

            opacity: 1;

            pointer-events: auto;
        }


        /* =========================================
           SIDEBAR TITLE
        ========================================= */

        .sidebar-content h2 {

            margin-left: 13px;

            margin-bottom: 30px;

            font-size: 13px;

            font-weight: 400;

            letter-spacing: 3px;

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.65);

            white-space: nowrap;

            opacity: 0;

            transform:
                translateX(-15px);

            transition:

                opacity 0.35s ease 0.12s,

                transform 0.55s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        .sidebar.expanded
        .sidebar-content h2 {

            opacity: 1;

            transform:
                translateX(0);
        }


        /* =========================================
           SIDEBAR ITEMS
        ========================================= */

        .sidebar-item {

            position: relative;

            width: 100%;
            height: 52px;

            display: flex;

            align-items: center;

            gap: 18px;

            padding:
                0 13px;

            color: #fff;

            text-decoration: none;

            border-radius: 7px;

            opacity: 0.72;

            transition:

                background 0.2s ease,

                opacity 0.2s ease,

                padding-left 0.25s ease;
        }


        .sidebar-item:hover {

            background:
                rgba(255, 255, 255, 0.06);

            opacity: 1;
        }


        /* =========================================
           SIDEBAR ICON
        ========================================= */

        .sidebar-icon {

            width: 30px;
            height: 30px;

            object-fit: contain;

            flex-shrink: 0;

            display: block;
        }


        /* =========================================
           SIDEBAR TEXT
        ========================================= */

        .sidebar-item span {

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            white-space: nowrap;

            opacity: 0;

            transform:
                translateX(-10px);

            pointer-events: none;

            transition:

                opacity 0.3s ease 0.08s,

                transform 0.4s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        /*
         * Show text only when expanded.
         */

        .sidebar.expanded
        .sidebar-item span {

            opacity: 1;

            transform:
                translateX(0);

            pointer-events: auto;
        }


        /* =========================================
           TOOLTIP
        ========================================= */

        .sidebar-item::after {

            content:
                attr(data-tooltip);

            position: absolute;

            left: calc(100% + 12px);

            top: 50%;

            transform:
                translate(
                    -8px,
                    -50%
                );

            padding:
                8px 12px;

            border-radius: 6px;

            background:
                rgba(15, 15, 15, 0.96);

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            color: #fff;

            font-size: 12px;

            letter-spacing: 1px;

            white-space: nowrap;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.45);

            transition:

                opacity 0.2s ease,

                transform 0.25s ease,

                visibility 0.2s ease;

            z-index: 100;
        }


        /*
         * Tooltip only appears while
         * sidebar is collapsed.
         */

        .sidebar:not(.expanded)
        .sidebar-item:hover::after {

            opacity: 1;

            visibility: visible;

            transform:
                translate(
                    0,
                    -50%
                );
        }


        /*
         * Never show tooltip while expanded.
         */

        .sidebar.expanded
        .sidebar-item::after {

            display: none;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main-content {

            width: 100%;

            min-height: 100vh;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero-section {

            width: 100%;

            height: 100vh;

            min-height: 600px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            background-image:
                url('night_cityscape.jpg');

            background-size: cover;

            background-position: center;

            overflow: hidden;
        }


        /* =========================================
           HERO BLACK FADE
        ========================================= */

        .hero-section::after {

            content: "";

            position: absolute;

            inset: 0;

            background: #000;

            opacity: 0;

            pointer-events: none;

            z-index: 1;

            transition:
                opacity 1.5s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        .hero-section.fade-background::after {

            opacity: 1;
        }


        /* =========================================
           HERO CONTENT
        ========================================= */

        .hero-content {

            position: relative;

            width: 100%;
            height: 100%;

            z-index: 2;
        }


        /* =========================================
           TITLE
        ========================================= */

        .central-title {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            color: #fff;

            font-family:
                "CursiveFont",
                cursive;

            font-size:
                clamp(
                    4rem,
                    8vw,
                    8rem
                );

            font-weight: 300;

            line-height: 1;

            white-space: nowrap;

            text-align: center;

            opacity: 1;

            text-shadow:
                0 0 10px
                rgba(
                    255,
                    255,
                    255,
                    0.3
                );

            z-index: 5;

            transition:

                left 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                top 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                transform 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                font-size 1.35s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ),

                opacity 0.8s ease 1.35s,

                text-shadow 1s ease;
        }


        /* =========================================
           FINAL TITLE
        ========================================= */

        .intro-finished .central-title {

            left: 110px;

            top: 34px;

            transform:
                translate(
                    0,
                    0
                );

            font-size: 2rem;

            /*
             * This begins fading only after
             * the movement finishes.
             */

            opacity: 0.58;

            text-shadow:
                0 0 8px
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );
        }


        /* =========================================
           MOBILE TITLE
        ========================================= */

        .mobile-title {

            display: none;
        }


        /* =========================================
           SEARCH
        ========================================= */

        .hero-search {

            position: absolute;

            top: 27px;

            right: 55px;

            width: 360px;

            height: 44px;

            display: flex;

            align-items: center;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            opacity: 0;

            transform:
                translateY(-12px);

            pointer-events: none;

            transition:

                opacity 0.7s ease,

                transform 0.7s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                ),

                border-color 0.25s ease,

                background 0.25s ease,

                box-shadow 0.25s ease;
        }


        .intro-finished .hero-search {

            opacity: 1;

            transform:
                translateY(0);

            pointer-events: auto;

            transition-delay: 0.15s;
        }


        .hero-search:focus-within {

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.48
                );

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

            box-shadow:
                0 0 18px
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );
        }


        .hero-search-icon {

            width: 25px;
            height: 25px;

            object-fit: contain;

            flex-shrink: 0;

            margin-left: 14px;

            opacity: 0.55;
        }


        .hero-search-input {

            width: 100%;

            height: 100%;

            padding:
                0 15px;

            border: none;

            outline: none;

            background: transparent;

            color: #fff;

            font-family: inherit;

            font-size: 14px;

            letter-spacing: 1px;
        }


        .hero-search-input::placeholder {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.36
                );

            opacity: 1;
        }


        /* =========================================
           LOWER SECTIONS
        ========================================= */

        .lower-section {

            width: 100%;

            min-height: 100vh;

            background: #000;

            padding: 80px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .sidebar {

                --sidebar-width: 60px;

                --expanded-width: 245px;
            }


            .sidebar.expanded {

                width:
                    var(--expanded-width);
            }


            .sidebar-content {

                padding:
                    0 8px;
            }


            .sidebar-toggle {

                top: 14px;

                left: 9px;
            }


            .sidebar.expanded
            .sidebar-toggle {

                left:
                    calc(
                        var(--expanded-width) - 54px
                    );
            }


            .toggle-icon {

                width: 25px;
                height: 25px;
            }


            .sidebar-content h2 {

                margin-left: 13px;
            }


            .sidebar-item {

                height: 52px;

                padding:
                    0 9px;
            }


            .sidebar-icon {

                width: 29px;
                height: 29px;

                display: block;
            }


            .hero-section {

                min-height: 100svh;

                height: 100svh;

                background-position:
                    center center;
            }


            /* Initial title */

            .central-title {

                font-size:
                    clamp(
                        3rem,
                        12vw,
                        5rem
                    );
            }


            /* Switch to LNS */

            .intro-finished
            .desktop-title {

                display: none;
            }


            .intro-finished
            .mobile-title {

                display: block;
            }


            /* Final mobile title */

            .intro-finished
            .central-title {

                left: 78px;

                top: 28px;

                transform:
                    translate(
                        0,
                        0
                    );

                font-size: 2rem;

                letter-spacing: 1px;

                opacity: 0.58;
            }


            /* Search */

            .hero-search {

                top: 20px;

                right: 15px;

                width:
                    calc(
                        100vw - 145px
                    );

                max-width: 220px;

                height: 40px;
            }


            .hero-search-icon {

                width: 21px;
                height: 21px;

                margin-left: 10px;
            }


            .hero-search-input {

                font-size: 12px;

                padding:
                    0 9px;
            }


            .lower-section {

                padding:
                    40px 25px;
            }


            .loading-icon {

                width: 75px;
                height: 75px;
            }
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 400px) {

            .intro-finished
            .central-title {

                left: 70px;

                top: 28px;

                font-size: 1.8rem;

                opacity: 0.58;
            }


            .hero-search {

                right: 10px;

                width:
                    calc(
                        100vw - 130px
                    );

                height: 38px;
            }


            .hero-search-icon {

                width: 19px;
                height: 19px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================= -->

    <div
        id="loadingScreen"
        class="loading-screen"
    >

        <img
            src="Icons/LoadingIcon.gif"
            alt="Loading"
            class="loading-icon"
        >

    </div>


    <!-- =========================================
         PAGE
    ========================================= -->

    <div class="page-container">


        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >


            <!-- SIDEBAR TOGGLE -->

            <button
                class="sidebar-toggle"
                id="sidebarToggle"
                aria-label="Open sidebar"
                aria-expanded="false"
            >

                <!-- Main logo -->

                <img
                    src="Icons/MainIcon.png"
                    alt=""
                    class="toggle-icon main-icon"
                >


                <!-- Arrow -->

                <img
                    src="Icons/Arrow.png"
                    alt=""
                    class="toggle-icon arrow-icon"
                >

            </button>


            <!-- SIDEBAR CONTENT -->

            <nav class="sidebar-content">


                <h2>
                    LateNight Studio
                </h2>


                <!-- HOME -->

                <a
                    href="#home"
                    class="sidebar-item"
                    data-tooltip="Home"
                >

                    <img
                        src="Icons/HomeIcon.png"
                        alt=""
                        class="sidebar-icon"
                    >

                    <span>
                        Home
                    </span>

                </a>


                <!--
                    ADD MORE SECTIONS LIKE THIS:

                    <a
                        href="#prototypes"
                        class="sidebar-item"
                        data-tooltip="Prototypes"
                    >

                        <img
                            src="Icons/YourIcon.png"
                            alt=""
                            class="sidebar-icon"
                        >

                        <span>
                            Prototypes
                        </span>

                    </a>
                -->


            </nav>

        </aside>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="main-content">


            <!-- =================================
                 HOME
            ================================== -->

            <section
                class="hero-section"
                id="home"
            >

                <div class="hero-content">


                    <!-- TITLE -->

                    <h1 class="central-title">

                        <span class="desktop-title">
                            LateNight Studio
                        </span>


                        <span class="mobile-title">
                            LNS
                        </span>

                    </h1>


                    <!-- SEARCH -->

                    <div
                        class="hero-search"
                    >

                        <img
                            src="Icons/Search.png"
                            alt=""
                            class="hero-search-icon"
                        >


                        <input
                            type="text"
                            id="heroSearch"
                            class="hero-search-input"
                            placeholder="Search..."
                            maxlength="50"
                            autocomplete="off"
                        >

                    </div>

                </div>

            </section>


            <!-- =================================
                 FUTURE SECTIONS
            ================================== -->

            <section
                class="lower-section"
                id="prototypes"
            ></section>


            <section
                class="lower-section"
                id="projects"
            ></section>


            <section
                class="lower-section"
                id="about"
            ></section>


        </main>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const loadingScreen =
            document.getElementById(
                "loadingScreen"
            );


        const heroSection =
            document.querySelector(
                ".hero-section"
            );


        const searchInput =
            document.getElementById(
                "heroSearch"
            );


        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const sidebarToggle =
            document.getElementById(
                "sidebarToggle"
            );


        /* =========================================
           LOADING SCREEN
        ========================================= */

        const MIN_LOADING_TIME = 1000;

        const MAX_LOADING_TIME = 10000;


        const loadingStartedAt =
            performance.now();


        let pageFinishedLoading =
            false;


        function finishInitialLoading() {

            if (pageFinishedLoading) {
                return;
            }


            pageFinishedLoading = true;


            const elapsed =
                performance.now()
                -
                loadingStartedAt;


            const remaining =
                Math.max(
                    0,
                    MIN_LOADING_TIME
                    -
                    elapsed
                );


            setTimeout(
                function() {

                    loadingScreen.classList.add(
                        "finished"
                    );


                    /*
                     * Wait for loading screen
                     * fade before starting intro.
                     */

                    setTimeout(
                        function() {

                            startIntroAnimation();

                        },
                        700
                    );

                },
                remaining
            );
        }


        /* =========================================
           PAGE LOADED
        ========================================= */

        window.addEventListener(
            "load",
            function() {

                finishInitialLoading();

            }
        );


        /* =========================================
           MAXIMUM LOADING TIME
        ========================================= */

        setTimeout(
            function() {

                if (!pageFinishedLoading) {

                    finishInitialLoading();

                }

            },
            MAX_LOADING_TIME
        );


        /* =========================================
           INTRO ANIMATION
        ========================================= */

        function startIntroAnimation() {

            /*
             * Move title.
             */

            document.body.classList.add(
                "intro-finished"
            );


            /*
             * Fade city background to black.
             */

            heroSection.classList.add(
                "fade-background"
            );


            /*
             * Focus search after
             * title animation.
             */

            setTimeout(
                function() {

                    searchInput.focus();

                },
                1550
            );
        }


        /* =========================================
           FUTURE LOADING FUNCTIONS
        ========================================= */

        function showLoadingScreen() {

            loadingScreen.classList.remove(
                "finished"
            );
        }


        function finishLoading() {

            loadingScreen.classList.add(
                "finished"
            );
        }


        /* =========================================
           SIDEBAR TOGGLE
        ========================================= */

        sidebarToggle.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                const isExpanded =
                    sidebar.classList.contains(
                        "expanded"
                    );


                sidebar.classList.toggle(
                    "expanded"
                );


                sidebarToggle.setAttribute(
                    "aria-expanded",
                    !isExpanded
                );


                sidebarToggle.setAttribute(
                    "aria-label",
                    !isExpanded
                        ? "Close sidebar"
                        : "Open sidebar"
                );
            }
        );


        /* =========================================
           SEARCH
        ========================================= */

        searchInput.addEventListener(
            "input",
            function() {

                if (
                    this.value.length > 50
                ) {

                    this.value =
                        this.value.substring(
                            0,
                            50
                        );
                }
            }
        );


    </script>

</body>

</html>
