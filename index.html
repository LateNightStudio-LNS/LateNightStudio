<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LateNight Studio | Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        .page-container {
            width: 100vw;
            min-height: 100vh;
        }

        /* =========================
           COLLAPSIBLE SIDEBAR
           ========================= */

        .sidebar {
            --sidebar-width: 72px;
            --expanded-width: 280px;

            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;

            width: var(--sidebar-width);
            height: 100vh;

            background: #000;
            border-right: 1px solid rgba(255, 255, 255, 0.18);

            overflow: hidden;

            transition:
                width 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.55s ease;
        }

        /* Expand when hovered */
        .sidebar:hover {
            width: var(--expanded-width);
            box-shadow: 12px 0 35px rgba(0, 0, 0, 0.45);
        }

        /* Stay expanded after clicking */
        .sidebar.expanded {
            width: var(--expanded-width);
            box-shadow: 12px 0 35px rgba(0, 0, 0, 0.45);
        }


        /* =========================
           SIDEBAR BUTTON
           ========================= */

        .sidebar-toggle {
            position: absolute;

            top: 16px;
            left: 12px;

            width: 42px;
            height: 42px;

            border: none;
            outline: none;
            padding: 0;

            background: transparent;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                left 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Move button to top-right when expanded */
        .sidebar:hover .sidebar-toggle,
        .sidebar.expanded .sidebar-toggle {
            left: calc(var(--expanded-width) - 58px);
        }


        /* =========================
           LOGO
           ========================= */

        .sidebar-logo {
            width: 27px;
            height: 27px;

            object-fit: contain;

            display: block;

            transition:
                opacity 0.3s ease,
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Hide logo when expanded */
        .sidebar:hover .sidebar-logo,
        .sidebar.expanded .sidebar-logo {
            opacity: 0;
            transform: scale(0.7);
        }


        /* =========================
           ARROW
           ========================= */

        .sidebar-arrow {
            position: absolute;

            width: 18px;
            height: 18px;

            object-fit: contain;

            opacity: 0;

            /*
                Your PNG points LEFT.
                Rotating it 180 degrees makes it point RIGHT.
            */
            transform: rotate(180deg);

            transition:
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.2s ease;
        }

        /* Show arrow while collapsed */
        .sidebar:not(:hover):not(.expanded) .sidebar-arrow {
            opacity: 1;
        }

        /* When expanded, rotate arrow back 180 degrees */
        .sidebar:hover .sidebar-arrow,
        .sidebar.expanded .sidebar-arrow {
            opacity: 1;
            transform: rotate(0deg);
        }


        /* =========================
           EXPANDED SIDEBAR CONTENT
           ========================= */

        .sidebar-content {
            position: absolute;

            top: 90px;
            left: 32px;

            width: 216px;

            opacity: 0;
            transform: translateX(-18px);

            pointer-events: none;

            transition:
                opacity 0.35s ease 0.08s,
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .sidebar:hover .sidebar-content,
        .sidebar.expanded .sidebar-content {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .sidebar-content h2 {
            font-size: 13px;
            font-weight: 400;

            letter-spacing: 3px;
            text-transform: uppercase;

            margin-bottom: 28px;

            color: rgba(255, 255, 255, 0.65);
        }

        .sidebar-content a {
            display: block;

            color: #fff;
            text-decoration: none;

            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;

            padding: 13px 0;

            opacity: 0.7;

            transition:
                opacity 0.2s ease,
                padding-left 0.25s ease;
        }

        .sidebar-content a:hover {
            opacity: 1;
            padding-left: 8px;
        }


        /* =========================
           MAIN CONTENT
           ========================= */

        .main-content {
            width: 100%;
            min-height: 100vh;
        }


        /* =========================
           HERO
           ========================= */

        .hero-section {
            height: 100vh;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.2) 0%,
                    rgba(0, 0, 0, 1) 100%
                ),
                url('night_cityscape.jpg');

            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            position: relative;
        }


        /* =========================
           TITLE
           ========================= */

        .central-title {
            color: #fff;

            font-family: "CursiveFont", cursive;

            font-size: 8rem;
            font-weight: 300;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.3);

            margin-bottom: 20px;

            position: relative;

            text-align: center;
        }

        .title-swash {
            width: 80%;
            height: 2px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    #fff 10%,
                    #fff 90%,
                    transparent
                );

            position: absolute;

            bottom: -30px;
            left: 10%;

            border-radius: 5px;

            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.3);
        }


        /* =========================
           LOWER SECTIONS
           ========================= */

        .lower-section {
            background: #000;

            min-height: 100vh;

            padding: 80px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .sidebar {
                --expanded-width: 245px;
            }

            .central-title {
                font-size: 4rem;
            }

            .lower-section {
                padding: 40px 25px;
            }
        }
    </style>
</head>


<body>

    <div class="page-container">

        <!-- =========================
             COLLAPSIBLE SIDEBAR
             ========================= -->

        <aside class="sidebar" id="sidebar">

            <button
                class="sidebar-toggle"
                id="sidebarToggle"
                aria-label="Open sidebar"
                aria-expanded="false"
            >

                <!-- YOUR LOGO PNG -->
                <img
                    class="sidebar-logo"
                    src="your-logo.png"
                    alt=""
                >

                <!-- YOUR ARROW PNG -->
                <img
                    class="sidebar-arrow"
                    src="your-arrow.png"
                    alt=""
                >

            </button>


            <!-- SIDEBAR CONTENT -->

            <nav class="sidebar-content">

                <h2>LateNight Studio</h2>

                <a href="#home">Home</a>
                <a href="#prototypes">Prototypes</a>
                <a href="#projects">Projects</a>
                <a href="#about">About</a>

            </nav>

        </aside>


        <!-- =========================
             MAIN CONTENT
             ========================= -->

        <main class="main-content">


            <!-- HERO -->

            <section
                class="hero-section"
                id="home"
            >

                <h1 class="central-title">

                    LateNight Studio

                    <div class="title-swash"></div>

                </h1>

            </section>


            <!-- SECTION 2 -->

            <section
                class="lower-section"
                id="prototypes"
            ></section>


            <!-- PROJECTS -->

            <section
                class="lower-section"
                id="projects"
            ></section>


            <!-- ABOUT -->

            <section
                class="lower-section"
                id="about"
            ></section>


        </main>

    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        const sidebar =
            document.getElementById("sidebar");

        const toggle =
            document.getElementById("sidebarToggle");


        toggle.addEventListener("click", (event) => {

            event.stopPropagation();

            sidebar.classList.toggle("expanded");


            const isExpanded =
                sidebar.classList.contains("expanded");


            toggle.setAttribute(
                "aria-expanded",
                isExpanded
            );


            toggle.setAttribute(
                "aria-label",
                isExpanded
                    ? "Close sidebar"
                    : "Open sidebar"
            );

        });

    </script>

</body>
</html>
