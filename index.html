<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LateNight Studio | Home</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000; /* Lower section color */
            color: #fff;
            font-family: sans-serif; /* Clean sans-serif for main text */
            overflow-x: hidden;
        }

        /* The main container to handle the layout and scrolling */
        .page-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* The Left Sidebar (as drawn) */
        .sidebar {
            width: 80px; /* Narrow as requested */
            background-color: #000;
            border-right: 1px solid rgba(255, 255, 255, 0.2); /* Dividing line */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            height: 100vh; /* Fills full screen initially */
            position: fixed; /* Stays fixed while main content scrolls */
            left: 0;
            top: 0;
        }

        /* Sidebar Logo Area (Top) */
        .logo-box {
            width: 50px;
            height: 50px;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-arrows {
            font-size: 24px;
            font-weight: bold;
        }

        .sidebar-line {
            width: 1px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        /* Sidebar vertical text */
        .vertical-icons-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: auto; /* Push towards bottom */
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            margin-left: 80px; /* Offset for the sidebar */
            width: calc(100vw - 80px);
            display: flex;
            flex-direction: column;
        }

        /* Section 1: The Hero Section (With Background Fade) */
        .hero-section {
            height: 100vh; /* Full screen height */
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 1) 100%), 
                              url('night_cityscape.jpg'); /* REPLACE with your image file name */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center main text */
            align-items: center;
            position: relative;
        }

        /* Central Title (Refined script type) */
        .central-title {
            color: #fff;
            font-family: "CursiveFont", cursive; /* Replace 'CursiveFont' with an actual calligraphy font file if you have one, otherwise defaults to browser cursive */
            font-size: 8rem; /* Large size for the central title */
            font-weight: 300;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); /* Subtle glow */
            margin-bottom: 20px;
            position: relative; /* For placement of swash */
        }

        /* The long swash underline drawn below the title */
        .title-swash {
            width: 80%; /* Takes up most of the central width */
            height: 2px;
            background: linear-gradient(to right, transparent, #fff 10%, #fff 90%, transparent);
            position: absolute;
            bottom: -30px; /* Placed below the text */
            left: 10%;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Scroll-Down Call to Action (at the bottom of the hero) */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1.5px;
        }

        .scroll-hint svg {
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.8);
        }

        /* Section 2: The Content Section (Faded into black) */
        .lower-section {
            background-color: #000;
            min-height: 100vh; /* Minimum full screen height to start */
            padding: 80px;
            display: flex;
            justify-content: center;
            align-items: start;
        }

        .section-2-label {
            color: rgba(255, 255, 255, 0.5); /* Faint as visualized */
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- SIDEBAR (Fixed Left) -->
        <div class="sidebar">
            <div class="logo-box">
                <span class="logo-arrows">&#8601;&#8594;</span> <!-- Approximation of the arrows you drew -->
            </div>
            <div class="sidebar-line"></div>
            <div class="vertical-icons-text">I<br>c<br>o<br>n<br>s</div>
        </div>

        <!-- MAIN SCROLLING CONTENT -->
        <div class="main-content">
            
            <!-- Hero Section (Night City Fade) -->
            <div class="hero-section">
                
                <h1 class="central-title">
                    Title
                    <div class="title-swash"></div> <!-- The elegant underline -->
                </h1>

                <!-- Scroll Down Hint -->
                <div class="scroll-hint">
                    <svg viewBox="0 0 24 24"><path d="M12 21l-12-18h24z"/></svg> <!-- Basic down arrow -->
                    I can scroll down
                </div>

            </div>

            <!-- Lower Section (Pure Black Content) -->
            <div class="lower-section">
                <p class="section-2-label">SECTION 2: PROTOTYPES<br>(Scroll up to return)</p>
            </div>

        </div>

    </div>

</body>
</html>
